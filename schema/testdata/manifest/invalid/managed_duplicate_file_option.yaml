# invalid: the same file option is overridden twice at the same path — here as
# two entries identical in every field, which is the shape a schema can see as
# well as the parser can. The parser also refuses two entries for one option at
# one path whose values differ; one of the two would describe output nothing
# ever has.
version: 1
modules:
  - path: proto
generate:
  - name: go
    inputs:
      - module: proto
    plugins:
      - local: protoc-gen-go
        out: gen/go
    managed:
      override:
        - file_option: go_package_prefix
          value: example.com/acme/gen/go
        - file_option: go_package_prefix
          value: example.com/acme/gen/go
