# beyond: break/field_type_changed carries a discriminant, so a permission
# against it without a change is refused. Whether a rule carries a
# discriminant is a fact about the fixed set of rules the tool ships with,
# not about this file, so the schema cannot check it.
version: 1
modules:
  - path: api
breaking:
  allow:
    - rule: break/field_type_changed
      subject: example.orders.v1.Order.total
      reason: widening
