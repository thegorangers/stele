# beyond: JSON Schema's uniqueItems compares whole items, and these two differ
# in severity. That two entries may not name the same rule is a constraint over
# one field across items, which the parser checks and the schema cannot state.
version: 1
modules:
  - path: api
breaking:
  rules:
    - id: break/message_removed
      severity: warning
      reason: temporary
    - id: break/message_removed
      severity: "off"
      reason: temporary too
