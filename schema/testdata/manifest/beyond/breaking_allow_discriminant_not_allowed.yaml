# beyond: break/message_removed carries no discriminant beyond its subject,
# so a permission against it with a change is refused. Whether a rule carries
# a discriminant is a fact about the fixed set of rules the tool ships with,
# not about this file, so the schema cannot check it.
version: 1
modules:
  - path: api
breaking:
  allow:
    - rule: break/message_removed
      subject: example.orders.v1.Draft
      change: something
      reason: because
