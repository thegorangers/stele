# The lock records the tiers the manifest does not pin, and only those: a
# module@version or a per-platform digest is already named by the manifest.
version: 1
plugins:
  - name: protoc-gen-found
    origin: path
    version: unknown
  - name: protoc-gen-house
    origin: file
    version: unknown
    path: tools/protoc-gen-house
