# beyond: one request — the same address at the same ref — is pinned to two
# commits. The items differ, so uniqueItems cannot see it; the parser refuses
# the ambiguity, because the pinned run looks entries up by (git, ref) and
# cannot answer one lookup with two commits.
version: 1
deps:
  - name: example
    git: gh:acme/example
    ref: main
    sha: 9f4c2b1a5d7e3f6081b2c4d5e6f708192a3b4c5d
  - name: also-example
    git: gh:acme/example
    ref: main
    sha: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d
