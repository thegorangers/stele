  # AIP-158 (general): Pagination
  - id: 158
    state: implemented
    rules:
      - aip/158_list_request_page_size
      - aip/158_list_request_page_token
      - aip/158_list_response_next_page_token
    reason: "re-measured with the rules themselves over 59 hand-written fleet files: 14 requests without an int32 page_size, 15 without a string page_token, 15 responses without a string next_page_token, across 8 files. The design document's throwaway parser said 8 page_size findings; the rules say 14, which is why the re-measurement is the standard. Server-streaming List methods are excluded: streaming is what pagination exists to avoid"
  # AIP-159 (general): Reading across collections
