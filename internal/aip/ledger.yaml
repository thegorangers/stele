# The ledger: what has been decided about each AIP.
#
# This file is hand-written judgement and is the only hand-written half of the
# inventory. The list of AIPs it must cover is not written here: it is
# index.tsv, derived from upstream by internal/aip/aipsync, and a test fails
# when the two disagree in either direction. An AIP upstream carries and this
# file does not classify is a failing test, not a gap somebody has to notice.
#
# States: implemented (names the rules), candidate (decidable from a
# descriptor, no rule yet), declined (deliberately no rule — either the AIP
# states no requirement about a file, or a decidable check was measured and
# rejected), undecidable (the AIP does state a requirement about protos and no
# descriptor can decide it). `untriaged` means read and not decided, and it
# fails exactly as a missing entry does.
version: 1
aips:
  # AIP-1 (general): AIP Purpose and Guidelines
  - id: 1
    state: declined
    reason: "the AIP program's own process; there is nothing in a descriptor to check"
