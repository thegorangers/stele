  # AIP-121 (general): Resource-oriented design
  - id: 121
    state: undecidable
    reason: "whether a set of messages is a resource model is the judgement no descriptor answers; the tool can see messages and methods, not what they represent"
  # AIP-122 (general): Resource names
  - id: 122
    state: undecidable
    reason: "a resource name is a string, and nothing in a descriptor distinguishes one from any other string; the fleet's 316 identifier fields would be neither confirmed nor refuted"
  # AIP-123 (general): Resource types
  - id: 123
    state: candidate
    reason: "decidable once google.api.resource is present: the annotation exists and its type follows service/Type. Measured against the fleet it fires on 35/35 files, because no file declares the annotation at all"
  # AIP-124 (general): Resource association
  - id: 124
    state: undecidable
    reason: "which field references which resource is exactly what the descriptor does not say"
  # AIP-126 (general): Enumerations
  - id: 126
    state: implemented
    rules:
      - stele/enum_zero_value_unspecified
      - stele/enum_value_prefix
      - stele/enum_value_upper_snake_case
  # AIP-127 (general): HTTP and gRPC Transcoding
  - id: 127
    state: candidate
    reason: "decidable only once the file imports google/api/annotations.proto, and indistinguishable from an unannotated descriptor set when it does not. It fires on every method of every file that has not adopted the annotation, so its roll-up line would read the same on every run of every such repository -- a number that never moves teaches nothing and ages into furniture. Not shipped for that reason rather than for its volume"
  # AIP-128 (general): Declarative-friendly interfaces
  - id: 128
    state: undecidable
    reason: "whether an interface is declarative-friendly is a property of the system behind it"
  # AIP-129 (general): Server-Modified Values and Defaults
  - id: 129
    state: undecidable
    reason: "which values a server modifies is behaviour, not shape"
  # AIP-130 (general): Methods
  - id: 130
    state: undecidable
    reason: "prose about what a method should be; the decidable fragments live in AIP-131 to AIP-136"
  # AIP-131 (general): Standard methods: Get
  - id: 131
    state: candidate
    reason: "decidable: a method named GetX takes GetXRequest and returns X. Measured, 25 findings across 12/35 files, and the same objection the roadmap records against rpc_response_named_for_method applies to most of them"
  # AIP-132 (general): Standard methods: List
  - id: 132
    state: candidate
    rules:
      - aip/158_list_request_page_size
      - aip/158_list_request_page_token
      - aip/158_list_response_next_page_token
    reason: "the pagination half is implemented by the AIP-158 rules. What is left -- a ListX method takes ListXRequest and returns ListXResponse -- is the naming objection the roadmap records against rpc_response_named_for_method, and is not implemented"
  # AIP-133 (general): Standard methods: Create
  - id: 133
    state: candidate
    reason: "decidable: a method named CreateX takes CreateXRequest and returns X. 0 findings on the fleet's request names"
  # AIP-134 (general): Standard methods: Update
  - id: 134
    state: candidate
    reason: "decidable: a method named UpdateX takes UpdateXRequest, carries an update_mask and returns X"
  # AIP-135 (general): Standard methods: Delete
  - id: 135
    state: implemented
    rules:
      - aip/135_delete_returns_empty
    reason: "re-measured with the rule itself: 7 findings across 4 of 59 hand-written fleet files. The rule accepts google.protobuf.Empty, the resource itself (soft delete) and google.longrunning.Operation"
  # AIP-136 (general): Custom methods
  - id: 136
    state: undecidable
    reason: "whether a method should have been standard rather than custom is intent; the fleet has 77 non-standard methods and a descriptor cannot say which are wrong"
  # AIP-140 (general): Field names
  - id: 140
    state: declined
    reason: "the decidable half is field names in lower_snake_case, measured at 0 findings across 35 files and rejected in the roadmap with the rest of the casing rules; prepositions and reserved words are stylistic"
  # AIP-141 (general): Quantities
  - id: 141
    state: candidate
    reason: "decidable: a quantity is named _count rather than num_. 0 findings on the fleet"
  # AIP-142 (general): Time and duration
  - id: 142
    state: implemented
    rules:
      - aip/142_timestamp_field_time_suffix
    reason: "re-measured with the rule itself: 111 findings across 19 of 59 hand-written fleet files, every one of them the _at suffix. It is a default after all, at warning and rolled up into one line: a rule this broad is what the roll-up was built for, and the alternative -- a profile nobody enables -- ships dead. The other half of the AIP, that a duration is google.protobuf.Duration, is not implemented"
  # AIP-143 (general): Standardized codes
  - id: 143
    state: candidate
    reason: "decidable narrowly: a field named language_code, region_code or currency_code is a string"
  # AIP-144 (general): Repeated fields
  - id: 144
    state: candidate
    reason: "decidable: a repeated field has a plural name and is not a repeated map"
  # AIP-145 (general): Ranges
  - id: 145
    state: undecidable
    reason: "whether two fields form a range is intent"
  # AIP-146 (general): Generic fields
  - id: 146
    state: candidate
    reason: "decidable: google.protobuf.Any and Struct appear where a concrete type was available"
  # AIP-147 (general): Sensitive fields
  - id: 147
    state: undecidable
    reason: "whether a field is sensitive is knowledge about the data, not about its type"
  # AIP-148 (general): Standard fields
  - id: 148
    state: candidate
    reason: "decidable with caveats: a field carrying a standard name has the standard type (create_time is a Timestamp, uid is a string). It says nothing about a field that should have existed. Written, measured with the rule itself at 0 findings over 59 hand-written fleet files, and not shipped: a rule id is permanent, and the standard the built-ins were held to is evidence before an id rather than after it"
  # AIP-149 (general): Unset field values
