# Dependencies are pinned deliberately throughout this repository — the Go
# module graph via go.sum, the actions in every workflow by tag, goreleaser
# and cosign by exact version in RELEASING.md and the workflows themselves.
# A pin that nobody revisits is a pin against the wrong version forever, so
# Dependabot opens the pull requests; it never merges them. Each one goes
# through the same review and CI as any other change, including the parity
# suite, because a dependency bump is exactly the kind of small change that
# can move generated bytes.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Actions are pinned by tag in .github/workflows/*.yml and
  # .github/actions/*/action.yml; nothing here re-pins them, it only opens
  # the pull request when upstream moves.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
