# Runs the parity acceptance suite against the corpus committed to this
# repository.
#
# It is a composite action rather than a job so that the two workflows that
# need it — every change, and every release — run exactly the same steps. A
# release that ran a different parity check from the one the pull request
# passed would be a release nobody had actually measured.
name: Parity
description: Measure byte-for-byte parity with the reference tool on the shipped corpus.

runs:
  using: composite
  steps:
    # The reference tool is not installed here either. The corpus pins it —
    # the version and, in the manifest's own downloads vocabulary, the url and
    # sha256 of the published binary for each platform — and the harness
    # fetches and verifies the entry matching this runner through the same
    # cache and the same digest check a pinned plugin goes through.
    #
    # This step used to carry the sha256 while the corpus carried the version.
    # It failed closed: a bumped version with no digest beside it aborted. But
    # two files for one pin can be half-updated, and only CI ever read the half
    # that named the bytes, so somebody running the harness on a workstation
    # measured against whatever buf their machine had.

    # The plugins are not installed here. The corpus manifests pin them by
    # module and version, stele installs those into its own cache, and the
    # harness puts that cache on the reference tool's PATH — so both tools run
    # the same binaries and the manifest is the only place a plugin version is
    # declared. Warming the cache is all this step does.
    - name: Warm the plugin cache
      shell: bash
      run: |
        set -euo pipefail
        for manifest in test/parity/corpus/manifests/*.yaml; do
          dir="$(mktemp -d)"
          cp "$manifest" "$dir/stele.yaml"
          go run ./cmd/stele plugins install --dir "$dir"
        done

    - name: Parity
      shell: bash
      run: go test -tags parity -count=1 -v ./test/parity/
