# Publishes the binaries for a tag, and refuses to publish anything it cannot
# vouch for.
#
# The rules this file exists to enforce:
#
#   - A tag cannot publish a broken build. gofmt, vet, the test suite and the
#     parity suite run first, in the same job, and nothing is built until they
#     pass. Parity is the acceptance criterion for this tool — the bytes it
#     writes are its contract — so a release that has not been measured against
#     the reference tool is not a release.
#   - A published binary cannot claim a version it was not built from. There is
#     no -ldflags stamping; the Go toolchain records the tag by itself, and a
#     goreleaser post-build hook asserts that what it recorded is exactly the
#     tag being released. A checkout that lost the tag, or a build that lost its
#     VCS information, fails the release instead of shipping a binary that says
#     (devel). See .goreleaser.yaml for the measurements behind that choice.
#   - Two builds of one tag are the same bytes. Checked, not asserted: the
#     binaries are built twice and the digests compared before anything is
#     uploaded.
#   - A consumer can tell a release published by this repository from one
#     published by somebody who got hold of the token. SHA256SUMS is signed
#     with cosign, keyless, through the OIDC token GitHub issues to this
#     workflow. Checksums alone answer "did the download arrive intact"; they
#     cannot answer "who published it", because whoever can publish a release
#     can publish matching checksums beside it.
name: Release

on:
  push:
    tags:
      - 'v*'
  # So the whole path can be exercised on a scratch tag before it is trusted.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true

permissions:
  contents: write
  # Keyless signing. This is the whole of the trust root: cosign exchanges this
  # short-lived token for a certificate that names the repository, the workflow
  # and the ref, so verification can ask for that identity by name and there is
  # no signing key anywhere to hold, rotate or lose.
  id-token: write

env:
  # Pinned exactly, not by minor. The compiler is an input to the bytes: a
  # patch release of Go can change them, and "1.26" would silently become a
  # different compiler between two builds of the same stele tag.
  GO_VERSION: '1.26.0'

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Decide which tag is being released
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            tag='${{ inputs.tag }}'
          else
            tag='${{ github.ref_name }}'
          fi
          case "$tag" in
            v*) ;;
            *) echo "not a version tag: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # The version comes from the tag the toolchain can see, so the whole
          # history and every tag must be present. A shallow checkout would
          # produce a pseudo-version and fail the verify hook below, which is
          # the right failure but a slow way to learn it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Before anything is built, so a tag cannot publish a broken build.
      - name: Test
        run: go test ./...

      # Output bytes are the contract this tool publishes, so a tag that
      # generates something different from the reference tool is not
      # releasable, however green the unit tests are. Same composite action CI
      # runs on every change, so a release cannot be measured differently from
      # the change that produced it.
      - name: Parity with the reference tool
        uses: ./.github/actions/parity

      - name: Install cosign
        # Deliberately not pinned via `cosign-release:`. Supplying that input
        # does not just fix the version — it switches the action onto its
        # custom-version code path, which downloads a *detached signature*
        # (a `.sig` file) to verify the cosign binary. No cosign v3 release
        # publishes a `.sig` asset; v3 releases ship
        # `cosign-linux-amd64.sigstore.json` bundles instead. So any v3
        # version pinned through this input fails at install, regardless of
        # which v3 version is named. This is what broke the v0.4.0 release.
        #
        # The pin that actually matters is `@v3` on the action itself: it
        # moves only when someone deliberately updates the tag, and its
        # default path installs cleanly. Before reintroducing
        # `cosign-release:`, first check whether the action's custom-version
        # path still requires a `.sig` asset — do not assume this is fixed.
        uses: sigstore/cosign-installer@v3

      # goreleaser's sboms section shells out to syft; unlike cosign it is
      # not bundled in, so it needs its own install step. Pinned exactly,
      # for the same reason govulncheck is pinned in ci.yml: a floating
      # syft version could change what a release's SBOM says about
      # unchanged code, without anything in this repository moving.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.51.0

      # Pinned exactly, like the Go version and for a weaker version of the
      # same reason. goreleaser does not compile anything — the bytes of a
      # binary come from the toolchain, and are the same as a plain
      # `go build -trimpath` would produce — but it decides the asset names,
      # the checksum file and the signing invocation, and those are the
      # release's shape. A floating version could change that shape between
      # two tags without anything in this repository moving.
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: v2.18.0

      # Reproducibility is claimed, so it is checked before anything is
      # uploaded rather than asserted afterwards. Two full builds of all four
      # platforms, compared by digest. The version guard runs inside each of
      # them, as a post-build hook, so a binary that misreports its version
      # also stops here.
      #
      # The tree must be clean for this to mean anything: an untracked file
      # makes the toolchain stamp +dirty, which both changes the bytes and
      # fails the guard. That is exactly how it was found the hard way, when
      # the build wrote into a dist/ that was not ignored. dist/ is
      # goreleaser's default output directory and is ignored; this asserts it
      # rather than trusting it.
      - name: Build twice and compare
        run: |
          set -euo pipefail
          goreleaser build --clean
          find dist -type f -name stele -printf '%P\n' | sort | \
            while read -r p; do sha256sum "dist/$p"; done | sed 's| dist/| |' >/tmp/first.txt
          cat /tmp/first.txt
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build left the tree dirty; the second build would not be comparable" >&2
            git status --porcelain >&2
            exit 1
          fi
          goreleaser build --clean
          find dist -type f -name stele -printf '%P\n' | sort | \
            while read -r p; do sha256sum "dist/$p"; done | sed 's| dist/| |' >/tmp/second.txt
          if ! diff -u /tmp/first.txt /tmp/second.txt; then
            echo "two builds of one tag differ; the release is not reproducible" >&2
            exit 1
          fi
          echo "two builds of ${{ steps.tag.outputs.tag }} produced identical bytes"

      - name: Release notes from the changelog
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The section for this tag, if the changelog has one.
          : >/tmp/notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" || $0 ~ "^## " tag "( |$)" { inside=1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md >/tmp/notes.md
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "No changelog entry for $TAG." >/tmp/notes.md
          fi

      # Builds a third time, signs SHA256SUMS with the workflow's OIDC identity
      # and uploads. The bytes it publishes are the bytes the step above proved
      # reproducible — that is what reproducible means — and the assertion
      # after it says so out loud rather than assuming.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          goreleaser release --clean --release-notes /tmp/notes.md

      - name: The published bytes are the bytes that were checked
        run: |
          set -euo pipefail
          # /tmp/first.txt names the four binaries built (twice) and compared
          # above. dist/SHA256SUMS names those same binaries plus their SBOMs,
          # which are generated only here, during release, and were never
          # part of the reproducibility check — a CycloneDX document carries
          # its own generation timestamp, so asking it to reproduce byte for
          # byte would be asking the wrong question. The check is therefore
          # that the verified binary digests are a SUBSET of what shipped,
          # not that the two sets are equal.
          cut -d' ' -f1 /tmp/first.txt | sort >/tmp/a
          cut -d' ' -f1 dist/SHA256SUMS | sort >/tmp/b
          missing="$(comm -23 /tmp/a /tmp/b)"
          if [ -n "$missing" ]; then
            echo "binaries verified by the reproducibility check are missing from the published SHA256SUMS:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "published digests include every binary that was verified"

      - name: Say how to verify what was published
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### Verifying $TAG"
            echo
            echo '```sh'
            echo "gh release download $TAG -R ${{ github.repository }} \\"
            echo "  -p SHA256SUMS -p SHA256SUMS.sig -p SHA256SUMS.pem"
            echo
            echo "cosign verify-blob SHA256SUMS \\"
            echo "  --signature SHA256SUMS.sig \\"
            echo "  --certificate SHA256SUMS.pem \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
