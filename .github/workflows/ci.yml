name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # Parity is this project's acceptance criterion, so it runs on every change
  # rather than on request. It is a separate job because it needs the network
  # and the reference tool, while build-and-test is hermetic and must stay
  # that way; keeping them apart also means a parity failure and a unit-test
  # failure are told apart at a glance.
  parity:
    name: parity with the reference tool
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Measure parity
        uses: ./.github/actions/parity

  # govulncheck needs the network, to fetch the vulnerability database, so it
  # cannot live in build-and-test alongside the hermetic checks CONTRIBUTING.md
  # promises run without one. It reads the module graph and reports only
  # vulnerabilities on a call path this tool actually ships — not merely a
  # dependency with an advisory open — so unlike a bare `go list -m all`
  # dependency scan it stays low-noise enough to fail the build rather than
  # only report. A finding here is real work, not a false alarm to triage.
  vulnerabilities:
    name: reachable known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # Pinned to an exact release, not @latest: the tool's own thesis is
      # that the bytes which ran should be knowable, and a floating tool
      # version can start saying something different about this repository
      # without anything in it changing. Only the binary is pinned — the
      # vulnerability database it queries is still fetched fresh on every
      # run, which is the freshness that actually matters here.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The AIP inventory is derived from an external corpus, so the question
  # "has upstream moved" needs the network and the question "have we said
  # what we think about every AIP" does not. Only the first is here; the
  # second is an ordinary test in build-and-test and runs on every change.
  aip-corpus:
    name: the AIP inventory matches upstream
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Compare the committed snapshot with upstream
        run: go run ./internal/aip/aipsync -check
