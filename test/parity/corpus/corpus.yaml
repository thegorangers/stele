# The parity corpus that ships with the tool.
#
# Every path here is relative to this file. What each checkout is for, and what
# this corpus does not cover, is in README.md beside it.
root: repos

# The reference tool, pinned. A parity job that compared against whatever the
# runner installed would report a change in that tool as a regression in this
# one, and nobody reading the failure could tell which it was.
#
# The version and the bytes are one pin and live in one file. The digest used
# to sit in the CI workflow instead: it failed closed, but two files for one
# pin can be half-updated, and a workstation run saw only half of it. The shape
# below is the manifest's own way of pinning a published binary — os, arch,
# url, sha256 — because this is the same question, and the harness resolves it
# with the same code.
buf_version: 1.48.0
buf_downloads:
  - os: linux
    arch: amd64
    url: https://github.com/bufbuild/buf/releases/download/v1.48.0/buf-Linux-x86_64
    sha256: 30cbac88a3cdda6e48dcf727f3cf9d2669d771c5d5be94f37e202c76a522b66e
  - os: linux
    arch: arm64
    url: https://github.com/bufbuild/buf/releases/download/v1.48.0/buf-Linux-aarch64
    sha256: 76b531e2c29be3b0ddf8b1034126b56506532b47c98b3968a49f09432536f39d
  - os: darwin
    arch: amd64
    url: https://github.com/bufbuild/buf/releases/download/v1.48.0/buf-Darwin-x86_64
    sha256: 5af7155250ad8af5f0a2f5701d1df83bfece53dfe98f13b3768d808468fcdbde
  - os: darwin
    arch: arm64
    url: https://github.com/bufbuild/buf/releases/download/v1.48.0/buf-Darwin-arm64
    sha256: 6ef7df6116c72ef3ccaa8574c9b8008389f0911c1921da4689e0abff3924a4bd

# The dependency addresses this corpus declares, and the trees that answer
# them. Nothing is cloned: the tree named here is the vendored copy inside the
# consumer's own checkout, which is the same tree the reference tool reads as a
# workspace module.
producers:
  - git: https://example.com/parity/telemetry.git
    dir: consumer/third_party/telemetry
  - git: https://example.com/parity/orders.git
    dir: consumer/third_party/orders
  # Named by no manifest of any checkout: it is reached only through orders,
  # which declares it. The corpus still has to answer its address, because
  # resolution follows a producer's dependencies the way it follows the root's.
  - git: https://example.com/parity/platform.git
    dir: consumer/third_party/platform

repos:
  - dir: managed
    generate:
      manifest: manifests/managed.yaml
  - dir: consumer
    generate:
      manifest: manifests/consumer.yaml
    # Export is measured against the other tool run over the same physical
    # files, one invocation at a time, because nothing produced a vendored tree
    # for a corpus that was written rather than grown. What each invocation is
    # for is in README.md.
    export:
      manifest: manifests/consumer.yaml
      invocations:
        # A dependency's module, whole. Every export the fleet performs is of
        # this shape: it is pointed at somebody else's repository, never at the
        # caller's own.
        - dep: orders
          reference:
            input: third_party/orders/proto
          # The producer imports a well-known type. Neither tool exports one.
          expect_absent:
            - google/protobuf
        # The same, with the import closure left out — the one thing the flag
        # decides.
        - dep: orders
          exclude_imports: true
          reference:
            input: third_party/orders/proto
          expect_absent:
            - google/protobuf
        # Narrowed. stele's coordinates are the producer's — the ones an import
        # statement uses — and the other tool's are the workspace's. The same
        # selection said two ways is the translation under test.
        - dep: orders
          paths:
            - parity/orders/v1
          reference:
            input: third_party/orders/proto
            paths:
              - third_party/orders/proto/parity/orders/v1
          expect_absent:
            - google/protobuf
        # The caller's own modules. No invocation in the measured fleet is of
        # this shape — that asymmetry was a design gap found late, and --dep is
        # what closed it — but the code path exists and is reachable from the
        # command line, so it is measured rather than assumed.
        - reference:
            input: proto
        # A dependency whose own vendored tree, not the consumer's, supplies
        # the import that reaches the output.
        - dep: telemetry
          reference:
            input: third_party/telemetry/proto
