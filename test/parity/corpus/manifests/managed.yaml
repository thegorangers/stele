# yaml-language-server: $schema=../../../../schema/stele.schema.json
#
# The other tool's configuration for this checkout is repos/managed/buf.yaml
# and repos/managed/buf.gen.yaml. This file says the same thing in stele's
# terms; the test compares the two tools' output, not their configuration.
version: 1
modules:
  - path: proto
  - path: internal/proto
generate:
  - name: go
    managed:
      # Four overrides of one file option, scoped by path. The order is
      # meaning: a file matched by several takes the LAST of them, which is
      # what the reference tool does. parity/order/v1 is declared BEFORE the
      # broader parity/order on purpose — every order file matches both, and
      # the broader one wins, so a reading that preferred the most specific
      # selector would fail here and only here.
      override:
        - file_option: go_package_prefix
          value: github.com/example/parity/gen
        - file_option: go_package_prefix
          path: parity/order/v1
          value: github.com/example/parity/gen/orderv1
        - file_option: go_package_prefix
          path: parity/order
          value: github.com/example/parity/gen/order
        - file_option: go_package_prefix
          path: parity/internal
          value: github.com/example/parity/gen/internal
    # Two inputs, one per module root. They are never merged into a single
    # generation request, and the reference tool's two `inputs` entries are
    # what that is being measured against.
    inputs:
      - module: proto
      - module: internal/proto
    plugins:
      - local: protoc-gen-go
        module: google.golang.org/protobuf/cmd/protoc-gen-go
        version: v1.36.12
        out: gen
        opt: paths=source_relative
      - local: protoc-gen-go-grpc
        module: google.golang.org/grpc/cmd/protoc-gen-go-grpc
        version: v1.5.1
        out: gen
        opt: paths=source_relative
