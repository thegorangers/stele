version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/example/consumer/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
inputs:
  - directory: proto
  - directory: third_party/telemetry/proto
    paths:
      - third_party/telemetry/proto/parity/telemetry/v1
